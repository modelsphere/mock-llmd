name: ci

# Tests and repository checks on every pull request and push to master.
# Building the image (and publishing it) is publish.yml.
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: azure/setup-helm@v5
      - run: go vet ./...
      - run: go test ./...
      - name: helm lint
        run: helm lint --strict ./helm
